name: Bionexo
description: >-
  Bionexo is Latin America's largest B2B healthcare supply-chain technology platform, founded in 2000
  in Sao Paulo, Brazil. It connects hospitals, clinics, laboratories, health-plan operators, distributors,
  suppliers and industry through an integrated cloud suite spanning e-procurement and marketplace, the Tasy
  hospital ERP, Clinica nas Nuvens clinic management, and the Brasindice drug-price reference, covering
  supply-chain, clinical and financial operations end to end. The platform serves more than 11,000 clients
  and roughly 90 million patients a year across Brazil, Argentina, Colombia and Mexico, running the largest
  healthcare B2B marketplace in the region. For system-to-system integration Bionexo exposes a partner
  Integration API documented via Swagger/OpenAPI and a Data Receiving API for EDI-style exchange of purchase
  quotations and supply-chain data between customer and supplier ERP systems and the Bionexo marketplace.
