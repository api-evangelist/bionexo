    Partner integration API for exchanging supply-chain and procurement data (purchase quotations, orders,
    catalog) between customer and supplier ERP systems and the Bionexo marketplace. Documented via a hosted
    Swagger UI; the OpenAPI definition (/swagger/v1/swagger.json) is served behind authentication.
